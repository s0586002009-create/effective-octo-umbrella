name: Build Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Install only required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generate official Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD_SECRET" && -n "$KEY_ALIAS_SECRET" && -n "$KEY_PASSWORD_SECRET" ]]; then
            KS="$RUNNER_TEMP/release-keystore.jks"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            STORE_PASS="$KEYSTORE_PASSWORD_SECRET"
            ALIAS="$KEY_ALIAS_SECRET"
            KEY_PASS="$KEY_PASSWORD_SECRET"
          else
            KS="$RUNNER_TEMP/temporary-release-keystore.jks"
            STORE_PASS="$(openssl rand -hex 16)"
            ALIAS="screenprank"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -noprompt -v \
              -keystore "$KS" -storetype JKS \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Screen Prank, OU=Android, O=Screen Prank, L=Tel Aviv, ST=Israel, C=IL"
          fi
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon clean assembleDebug assembleRelease

      - name: Prepare release assets
        if: github.ref == 'refs/heads/release/0.3' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk screen-prank-debug.apk
          cp app/build/outputs/apk/release/app-release.apk screen-prank-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-prank-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-prank-release.apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: github.ref == 'refs/heads/release/0.3'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3
          target_commitish: release/0.3
          name: מסך מופרע 0.3
          files: |
            screen-prank-debug.apk
            screen-prank-release.apk
          generate_release_notes: true
